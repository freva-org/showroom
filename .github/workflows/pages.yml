name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: actions/cache@v6
        with:
          path: |
            .prepared
            .cache
            .python-wheels
          key: prepared-${{ hashFiles('package-lock.json', 'scripts/prepare.mjs', 'scripts/build_examples.py', 'web/**', 'examples/*.py', 'notebooks/**', 'assets/waterpark-datasets.json') }}

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || 'https://freva-org.github.io/showroom' }}
          GH_TOKEN: ${{ secrets.HEALPIX_GEO_TOKEN || github.token }}
        run: |
          pip install -r requirements-docs.txt
          ./scripts/build.sh

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
