# The in-browser Python behind "Try in Python" on the landing page. 
pythonPlayground:
  enabled: true
  profile: freva-client
  # dask is required: the landing example opens a Zarr store with `chunks={}`.
  addons:
    - dask
    - cartopy-natural-earth-110m
  optionalAddons:
    - cartopy-natural-earth-110m
  network: https
  autostart: never
  editableSnippets: true
  maxSessions: 2
  consoleInPage: true
  notebook:
    enabled: true
    deployment: same-origin
    assistant:
      climateclaw:
        host: https://eve.dkrz.de
        expectedIssuer: https://freva-keycloak.cloud.dkrz.de/realms/Freva
        defaultModel: gpt-4.1
        scopeNote: >-
          Answer about the Waterpark HEALPix data on s3.waterpark.dkrz.de; prefer the stores
          listed in the Waterpark data panel. The stores are public Zarr over plain HTTPS, so
          open them by their https URL and nothing else, e.g.
          xr.open_zarr("https://s3.waterpark.dkrz.de/reanalysis/healpix/era5/P1M/level_7.zarr",
          chunks=None) (an s3://bucket/path becomes https://s3.waterpark.dkrz.de/bucket/path).
          This needs only fsspec, aiohttp and zarr; s3fs is not installed and not needed, so do
          not use s3:// URLs, s3fs or boto3 and do not try to install packages.
        examples:
          - title: Europe, July 2021
            prompt: |-
              Compute the mean near-surface air temperature over Europe in July 2021 and draw a map of it. Write one Python cell that does exactly these steps:

              1. Open the store with xarray over HTTPS (no s3:// URL, no s3fs):
                 ds = xr.open_zarr("https://s3.waterpark.dkrz.de/reanalysis/healpix/era5/P1M/level_7.zarr", chunks=None)
              2. Take July 2021 of the variable tas: field = ds["tas"].sel(time="2021-07").squeeze()
              3. The grid is HEALPix: there is no lat or lon dimension, only "cell", so never write .sel(lat=...) or .sel(lon=...). Read the cell centres from ds["latitude"].values and ds["longitude"].values. Longitude runs 0 to 360: first convert it with lon = numpy.where(lon > 180, lon - 360, lon).
              4. Keep the cells with -15 <= lon <= 35 and 35 <= lat <= 70: europe = field.isel(cell=numpy.flatnonzero(mask))
              5. Print how many cells are inside and their mean in K. The cells have equal area, so the plain mean is already the area-weighted mean.
              6. Plot the kept cells with matplotlib: plt.scatter(lon[mask], lat[mask], c=europe.values, s=4, cmap="RdYlBu_r"), a colour bar labelled "K", then plt.show().

              The worked example, to read if anything is unclear: https://waterpark.dkrz.de/examples/03_region_bbox/
          - title: Zonal mean
            prompt: |-
              Plot the zonal-mean near-surface air temperature of July 2021: temperature against latitude. Write one Python cell that does exactly these steps:

              1. Open the store with xarray over HTTPS (no s3:// URL, no s3fs):
                 ds = xr.open_zarr("https://s3.waterpark.dkrz.de/reanalysis/healpix/era5/P1M/level_7.zarr", chunks=None)
              2. Take July 2021 of the variable tas: field = ds["tas"].sel(time="2021-07").squeeze()
              3. HEALPix cells lie on rings of exactly the same latitude, so the zonal mean is a group-by over latitude, with no bins: lat = numpy.round(ds["latitude"].values, 8), then zonal = field.assign_coords(lat=("cell", lat)).groupby("lat").mean()
              4. Plot zonal (x, in K) against its latitude (y) with plt.plot, label both axes, then plt.show().
              5. Print the latitude of the warmest and of the coldest ring.

              The worked example, to read if anything is unclear: https://waterpark.dkrz.de/examples/04_zonal_mean/
          - title: Hovmöller diagram
            prompt: |-
              Draw a Hovmöller diagram of zonal-mean near-surface air temperature anomalies from 1980 to 2024: time on the x axis, latitude on the y axis. Write one Python cell that does exactly these steps:

              1. Open the small, coarse level 4 store with xarray over HTTPS (no s3:// URL, no s3fs):
                 ds = xr.open_zarr("https://s3.waterpark.dkrz.de/reanalysis/healpix/era5/P1M/level_4.zarr", chunks=None)
              2. Take the years 1980 to 2024 of tas: field = ds["tas"].sel(time=slice("1980", "2024"))
              3. Zonal mean per ring (HEALPix cells on one ring share their latitude exactly): lat = numpy.round(ds["latitude"].values, 8), then hov = field.assign_coords(lat=("cell", lat)).groupby("lat").mean().load()
              4. Anomalies against the 1980 to 2009 monthly climatology: clim = hov.sel(time=slice("1980", "2009")).groupby("time.month").mean(), then anom = hov.groupby("time.month") - clim
              5. Plot with plt.pcolormesh(anom["time"], anom["lat"], anom.transpose("lat", "time"), cmap="RdBu_r", vmin=-3, vmax=3, shading="nearest"), a colour bar labelled "K", then plt.show().

              The worked example, to read if anything is unclear: https://waterpark.dkrz.de/examples/06_hovmoeller/
    dataPanel:
      tree: home-1
      title: Waterpark data
      icon: ../assets/icons/tree.svg
      gridlook: true
      startNotebook: ../notebooks/era5_july_2021.ipynb
      seedNotebooks:
        - ../notebooks/era5_july_2021.ipynb
        - ../notebooks/examples/01_first_map.ipynb
        - ../notebooks/examples/02_global_mean.ipynb
        - ../notebooks/examples/03_region_bbox.ipynb
        - ../notebooks/examples/04_zonal_mean.ipynb
        - ../notebooks/examples/05_meridional_mean.ipynb
        - ../notebooks/examples/06_hovmoeller.ipynb
        - ../notebooks/examples/07_pyramid_levels.ipynb
        - ../notebooks/examples/08_cross_dataset.ipynb
  # monkeypatch healpix-geo until they release
  initialSource: |
    import micropip
    from pyodide.http import pyfetch
    _wheels = PORTAL_BASE_URL + "python-wheels/"
    _r = await pyfetch(_wheels + "wheels.json")
    _names = await _r.json() if _r.ok else []
    if isinstance(_names, list) and _names:
        await micropip.install([_wheels + _n for _n in _names], deps=False)
    print("healpix-geo is installed" if _names else "healpix-geo: no wheel is served here")
    del micropip, pyfetch, _wheels, _r, _names
  connectOrigins:
    - https://s3.waterpark.dkrz.de
    - https://freva.dkrz.de
  terminal:
    style: freva-client-terminal
    osControls: auto
    alwaysOnTop: true
    rememberAppearance: true

rendering:
  profile: portal-content-v1
  sources:
    - root: ../content
      mount: /docs/
      files:
        include:
          - "**/*.md"
        exclude:
          - "_fragments/**"
  assets:
    - root: ../assets
      mount: /assets/
  downloads:
    - root: ../examples
      mount: /downloads/examples/
      files:
        include: ["*.py", "requirements.txt"]
    - root: ../.python-wheels
      mount: /python-wheels/
      files:
        include: ["*.whl", "wheels.json"]
  diagnostics:
    warningsAsErrors: true

landings:
  home:
    path: /
    source: ./landings/home.yaml

services:
  dataApi:
    kind: databrowser
    baseUrl: https://freva.dkrz.de/api/freva-nextgen/databrowser
    authentication: optional
  stacApi:
    kind: stac
    catalogUrl: https://freva.dkrz.de/api/freva-nextgen/stacapi/product/?visible_collections=cmip6,dyamond,eerie,icdc,icon-dream,nextgems,obs,palmod,reanalysis-healpix

components:
  data:
    kind: databrowser
    enabled: true
    service: dataApi
    route: /databrowser/
    title: Data Browser
    description: Search the Waterpark catalogue.
    options:
      defaultFlavour: waterpark
      fixedFacets:
        project: waterpark
      defaultLayout: overview
      overview:
        order:
          - product
          - variable
          - time_frequency
          - healpix_level
          - experiment
          - model
          - realm
          - ensemble
          - time_aggregation
          - __time
          - __bbox
        mainFacets:
          - product
          - variable
          - time_frequency
          - healpix_level
          - experiment
          - model
          - realm
          - ensemble
          - time_aggregation
          - __time
          - __bbox
  catalog:
    kind: stac-browser
    enabled: true
    service: stacApi
    route: /stac-browser/
    title: STAC Browser
    description: The same holdings, as STAC collections and items.
    options:
      chrome:
        title: STAC Browser
        image: ../assets/logo-512.png
        footerLinks:
          - label: Freva
            href: https://www.freva.dkrz.de
          - label: DKRZ
            href: https://www.dkrz.de
      access:
        externalCatalogs: deny
      rootPage:
        intro: ../content/_fragments/catalog-intro.md
        title: AI-/Analysis-Ready Cloud Optimized
        description: >-
          Analysis-ready, cloud optimized HEALPix Zarr pyramids served from S3.
        keywords: [climate, FAIR, Freva, HEALPix, Zarr]
        license: CC-BY-4.0
        providers:
          - name: Alfred Wegener Institute, Helmholtz Centre for Polar and Marine Research (AWI)
            url: https://www.awi.de/en/
            roles: [producer]
            logo: ../assets/logos/awi.png
          - name: Helmholtz-Zentrum Hereon
            url: https://www.hereon.de/
            roles: [producer]
            logo: ../assets/logos/hereon.png
          - name: Universität Hamburg
            url: https://www.uni-hamburg.de/en.html
            roles: [producer]
            logo: ../assets/logos/uni-hamburg.png
          - name: Max Planck Institute for Meteorology (MPI-M)
            url: https://mpimet.mpg.de/en/homepage
            roles: [producer]
            logo: ../assets/logos/mpi-m.png
          - name: Deutsches Klimarechenzentrum (DKRZ)
            url: https://www.dkrz.de
            roles: [host]
            logo: ../assets/logos/dkrz.png
      linkPolicy:
        canonicalizeAdvertisedRoot: true
        hiddenRelations:
          - service-desc
  login:
    kind: auth
    enabled: false


